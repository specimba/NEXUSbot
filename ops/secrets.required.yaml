# ops/secrets.required.yaml — NEXUS_BOT credential manifest
#
# SINGLE SOURCE OF TRUTH for what this system needs.
# Contains NAMES, SCOPES and VALIDATION ONLY. Never put a value in this file.
# Values live in `.env` (gitignored) or the runtime secret store, entered by the owner.
#
#   python3 ops/preflight.py              # masked presence check
#   python3 ops/preflight.py --emit-example   # regenerate ../.env.example
#   python3 ops/preflight.py --validate   # run validate commands (network; opt-in)
#
version: 1
project: NEXUS_BOT
policy: owner-enters-locally-agents-see-names-only
mask: last4
storage_local: .env (gitignored, chmod 600)
storage_portable: ops/vault/bootstrap-<date>.tar.age (age-encrypted, owner passphrase)
example_file: .env.example
owner: primary-operator

entries:
  - name: GITHUB_PAT
    purpose: push to the private GitHub repo, open PRs, read CI status
    kind: pat-fine-grained
    used_by: ops/bootstrap.sh, git push, gh
    scope: single repo NEXUS_BOT; Contents=read/write; Metadata=read; Pull requests=read/write (only if PRs are used)
    forbidden: admin, org-wide, packages, actions, classic token, repo URL embedding
    required: true
    rotation_days: 30
    validate: gh api user --jq .login
    notes: pass via stdin (gh auth login --with-token) or env; never as https://TOKEN@github.com remote

  - name: DATABASE_URL
    purpose: Postgres connection for L0 state, jobs, eval results
    kind: dsn
    used_by: backend, migrations, tests
    scope: dedicated database + least-privilege role (no superuser, no CREATEDB)
    forbidden: sharing the production role with tests
    required: true
    rotation_days: 90
    validate: psql "$DATABASE_URL" -tAc "select 1"
    notes: local compose uses a throwaway role; cloud uses managed Postgres with TLS required

  - name: REDIS_URL
    purpose: event stream, queues, dedupe keys, rate limits
    kind: dsn
    used_by: backend, workers
    scope: dedicated logical DB; ACL user limited to required command families
    forbidden: FLUSHALL/KEYS in app code; default user with no password on a public host
    required: true
    rotation_days: 90
    validate: redis-cli -u "$REDIS_URL" ping
    notes: streams + consumer groups; assume at-least-once delivery

  - name: NEXUS_API_TOKEN
    purpose: service-to-service auth between dashboard/API and workers
    kind: bearer
    used_by: backend, web (server side only)
    scope: internal network only; rotate on any operator change
    forbidden: exposing to the browser client
    required: true
    rotation_days: 60
    validate: "true"
    notes: short-lived signed tokens preferred once auth is designed (ADR required)

  - name: SESSION_SECRET
    purpose: sign operator sessions for the control-panel dashboard
    kind: random-32b+
    used_by: web, backend
    scope: single deployment
    forbidden: reuse across environments; committing a sample value
    required: true
    rotation_days: 180
    validate: "true"
    notes: generate locally (openssl rand -base64 48); rotating invalidates sessions

  - name: ENCRYPTION_KEY
    purpose: field-level encryption for stored artifacts and connector credentials
    kind: random-32b
    used_by: backend
    scope: single deployment; key-id versioned for rotation
    forbidden: logging, exporting to the browser, storing beside the ciphertext
    required: true
    rotation_days: 365
    validate: "true"
    notes: support key rotation with a key-id prefix; keep old keys until re-encryption completes

  - name: ANTHROPIC_API_KEY
    purpose: primary reasoning/agent model for BOT roster
    kind: api-key
    used_by: backend, evaluation harness
    scope: workspace key with a spend limit; separate keys for dev and eval
    forbidden: shipping in client code; one shared key across environments
    required: true
    rotation_days: 90
    validate: "true"
    notes: per-variant cost accounting is mandatory (see L3 telemetry)

  - name: OPENAI_API_KEY
    purpose: cross-model baseline and judge diversity in the evaluation harness
    kind: api-key
    used_by: evaluation harness
    scope: project key with a spend limit
    forbidden: using it as a fallback that hides primary-model failures
    required: false
    rotation_days: 90
    validate: "true"
    notes: optional; enables paired cross-model comparison

  - name: AGENT_BROWSER_ENDPOINT
    purpose: browser-agent pool endpoint for L1 action layer
    kind: url
    used_by: workers/browser
    scope: authenticated internal endpoint
    forbidden: public exposure without auth; cookie export to logs
    required: false
    rotation_days: 0
    validate: "true"
    notes: not a secret on its own, but treated as sensitive infrastructure detail

  - name: AGENT_BROWSER_TOKEN
    purpose: auth for the browser-agent pool
    kind: bearer
    used_by: workers/browser
    scope: single pool, read/act only
    forbidden: reusing the operator's personal browser session token
    required: false
    rotation_days: 30
    validate: "true"
    notes: if a personal session is ever used, it is never copied into the repo or logs

  - name: SENTRY_DSN
    purpose: error and performance telemetry
    kind: dsn
    used_by: backend, web
    scope: project-scoped ingest key
    forbidden: sending secrets or full request bodies
    required: false
    rotation_days: 0
    validate: "true"
    notes: scrub PII and credentials in beforeSend

never_store:
  - vault passphrase
  - GitHub recovery codes
  - private keys (SSH, signing)
  - full browser cookies or session stores
  - cloud root/admin credentials
